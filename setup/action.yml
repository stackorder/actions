name: Set up stackorder
description: Download the stackorder CLI release for the runner, verify its SHA-256 checksum, cache it and add it to PATH.
author: Stackorder
branding:
  icon: layers
  color: purple

inputs:
  version:
    description: stackorder release to install, as 1.2.3 or v1.2.3, or latest for the newest published release.
    required: false
    default: latest
  token:
    description: github.com token sent to the GitHub API when resolving latest. The default is github.token on github.com and empty elsewhere, so a GitHub Enterprise Server token never leaves its server; pass a github.com token there to avoid anonymous rate limits.
    required: false
    default: ${{ github.server_url == 'https://github.com' && github.token || '' }}
  checksum:
    description: Verify the archive against the release's stackorder_<version>_checksums.txt. Only false disables it.
    required: false
    default: "true"

outputs:
  version:
    description: Installed version, without the leading v.
  path:
    description: Absolute path to the installed stackorder binary.

runs:
  using: node24
  main: dist/index.js
