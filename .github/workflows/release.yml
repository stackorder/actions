name: release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run check-dist

  release:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ github.ref_name }}
      PRERELEASE: ${{ contains(github.ref_name, '-') }}
    steps:
      - uses: actions/checkout@v5
      - name: Move the major tag to this release
        if: env.PRERELEASE == 'false'
        run: |
          major="${TAG%%.*}"
          newest=$(git ls-remote --tags --refs origin "refs/tags/$major.*" |
            sed 's#.*refs/tags/##' | grep -E "^$major\.[0-9]+\.[0-9]+$" | sort -V | tail -n 1)
          if [ "$newest" != "$TAG" ]; then
            echo "::notice::$TAG is not the newest $major release ($newest), so $major stays where it is"
            exit 0
          fi
          git tag -f "$major" "$GITHUB_SHA"
          git push -f origin "refs/tags/$major"
      - name: Take the release notes from the changelog
        run: |
          awk -v version="${TAG#v}" '
            /^## \[/ { printing = ($0 ~ "^## \\[" version "\\]") }
            printing && !/^## \[/ { print }
          ' CHANGELOG.md | sed -e :a -e '/^\n*$/{$d;N;ba' -e '}' > "$RUNNER_TEMP/notes.md"
          if [ -s "$RUNNER_TEMP/notes.md" ]; then
            echo "notes=$RUNNER_TEMP/notes.md" >> "$GITHUB_ENV"
          else
            echo "::warning::CHANGELOG.md has no section for $TAG; the release notes are generated from the commits"
          fi
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=(--repo "$GITHUB_REPOSITORY" --title "$TAG" --verify-tag)
          if [ -n "${notes:-}" ]; then
            flags+=(--notes-file "$notes")
          else
            flags+=(--generate-notes)
          fi
          if [ "$PRERELEASE" = true ]; then
            flags+=(--prerelease)
          fi
          gh release create "$TAG" "${flags[@]}"
