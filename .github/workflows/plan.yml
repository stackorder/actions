name: stackorder plan

on:
  workflow_call:
    inputs:
      server-url:
        description: Base URL of the Stackorder server.
        type: string
        required: true
      aws-role-arn:
        description: IAM role to assume for every stack that matches no key in aws-role-arn-map. Empty with no match skips AWS credentials.
        type: string
        default: ""
      aws-role-arn-map:
        description: JSON object from a stack path prefix such as stacks/prod/, an exact stack key path:instance or :instance (that instance in any directory) to IAM role ARN. An exact key wins, then :instance, then the longest matching prefix.
        type: string
        default: ""
      aws-role-session-name:
        description: AWS role session name, or a JSON object whose plan key is used. Characters outside [\w+=,.@-] become - and the name is cut to 64 characters. Empty keeps the configure-aws-credentials default.
        type: string
        default: ""
      aws-region:
        description: AWS region for the credentials.
        type: string
        default: us-east-1
      tool:
        description: terraform or tofu, used when the stack's matrix entry does not name a tool.
        type: string
        default: terraform
      tool-version:
        description: Tool version to install when the stack's matrix entry does not pin one.
        type: string
        default: latest
      stackorder-version:
        description: stackorder CLI release to install, as 1.2.3, v1.2.3 or latest.
        type: string
        default: latest
      runner:
        description: Runner label, or a JSON array or object for runs-on.
        type: string
        default: ubuntu-latest
      max-parallel:
        description: Maximum number of stacks planned at the same time.
        type: number
        default: 6
      working-directory:
        description: Directory to run stackorder in, relative to the repository root.
        type: string
        default: .
      base-ref:
        description: Git ref to diff against. Empty uses the pull request base.
        type: string
        default: ""
      stacks:
        description: Comma separated stack keys to restrict the plan to. Empty plans every affected stack.
        type: string
        default: ""
      env:
        description: Environment variables for the plan jobs, as KEY=VALUE lines or KEY<<DELIMITER multi-line values, the syntax of $GITHUB_ENV.
        type: string
        default: ""
    secrets:
      env:
        description: Environment variables with secret values for the plan jobs, in the syntax of the env input. Every value is masked.
        required: false

permissions: {}

defaults:
  run:
    shell: bash

jobs:
  resolve:
    if: github.event.pull_request.head.repo.fork == false
    runs-on: ${{ (startsWith(inputs.runner, '[') || startsWith(inputs.runner, '{')) && fromJSON(inputs.runner) || inputs.runner }}
    permissions:
      id-token: write
      contents: read
      checks: write
      pull-requests: read
    outputs:
      matrix: ${{ steps.resolve.outputs.matrix }}
      count: ${{ steps.resolve.outputs.count }}
      run-id: ${{ steps.resolve.outputs.run-id }}
      unconfirmed: ${{ steps.resolve.outputs.unconfirmed }}
      stackorder-version: ${{ steps.setup.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - id: setup
        uses: stackorder/actions/setup@v1
        with:
          version: ${{ inputs.stackorder-version }}
      - id: resolve
        uses: stackorder/actions/resolve@v1
        with:
          server-url: ${{ inputs.server-url }}
          base-ref: ${{ inputs.base-ref }}
          stacks: ${{ inputs.stacks }}
          working-directory: ${{ inputs.working-directory }}

  plan:
    name: plan ${{ matrix.key }}
    needs: resolve
    if: needs.resolve.outputs.count > 0
    runs-on: ${{ (startsWith(inputs.runner, '[') || startsWith(inputs.runner, '{')) && fromJSON(inputs.runner) || inputs.runner }}
    strategy:
      fail-fast: false
      max-parallel: ${{ inputs.max-parallel }}
      matrix: ${{ fromJSON(needs.resolve.outputs.matrix) }}
    permissions:
      id-token: write
      contents: read
      checks: write
      actions: read
    env:
      STACKORDER_RUN_ID: ${{ needs.resolve.outputs.run-id }}
      STACKORDER_TOOL: ${{ matrix.tool || inputs.tool }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ matrix.sha }}
      - if: env.STACKORDER_TOOL == 'terraform'
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ matrix.tool_version || inputs.tool-version }}
          terraform_wrapper: false
      - if: env.STACKORDER_TOOL != 'terraform'
        uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: ${{ matrix.tool_version || inputs.tool-version }}
          tofu_wrapper: false
      - uses: stackorder/actions/setup@v1
        with:
          version: ${{ needs.resolve.outputs.stackorder-version }}
      - name: Export env
        env:
          ENV_INPUT: ${{ inputs.env }}
          ENV_SECRET: ${{ secrets.env }}
        run: |
          exports=""
          failed=false
          fail() {
            echo "::error::$1"
            failed=true
          }
          mask() {
            local line
            while IFS= read -r line; do
              if [ -n "$line" ]; then
                printf '::add-mask::%s\n' "${line//%/%25}"
              fi
            done <<<"$1"
          }
          allowed() {
            local source="$1" number="$2" name="$3" upper
            if ! [[ "$name" =~ ^[A-Za-z_][A-Za-z0-9_]*$ ]]; then
              fail "Line $number of the $source does not start with a variable name followed by = or <<"
              return 1
            fi
            upper=$(printf '%s' "$name" | tr '[:lower:]' '[:upper:]')
            if [[ "$upper" =~ ^(GITHUB_|RUNNER_|ACTIONS_|STACKORDER_) ]] || [[ "$upper" =~ ^(PATH|HOME|NODE_OPTIONS|BASH_ENV|LD_PRELOAD)$ ]]; then
              fail "The $source sets $name, a reserved name: GITHUB_*, RUNNER_*, ACTIONS_*, STACKORDER_*, PATH, HOME, NODE_OPTIONS, BASH_ENV and LD_PRELOAD cannot be set, in any letter case"
              return 1
            fi
          }
          parse() {
            local source="$1" secret="$2" text="$3"
            local line number=0 start=0 name="" value="" delimiter="" count=0 open=false keep=false
            while IFS= read -r line; do
              number=$((number + 1))
              line="${line%$'\r'}"
              if [ "$open" = true ]; then
                if [ "$line" != "$delimiter" ]; then
                  if [ "$count" -eq 0 ]; then
                    value="$line"
                  else
                    value+=$'\n'"$line"
                  fi
                  count=$((count + 1))
                  continue
                fi
                open=false
                if [ "$secret" = true ]; then
                  mask "$value"
                fi
                if [ "$keep" = true ]; then
                  exports+="$name<<$delimiter"$'\n'
                  if [ "$count" -gt 0 ]; then
                    exports+="$value"$'\n'
                  fi
                  exports+="$delimiter"$'\n'
                fi
                continue
              fi
              if [[ "$line" =~ ^[[:space:]]*$ ]]; then
                continue
              fi
              name="${line%%=*}"
              delimiter="${line%%"<<"*}"
              if [[ "$line" == *=* ]] && [ "${#name}" -lt "${#delimiter}" ]; then
                value="${line#*=}"
                if [ "$secret" = true ] && [ -n "$value" ]; then
                  printf '::add-mask::%s\n' "${value//%/%25}"
                fi
                if allowed "$source" "$number" "$name"; then
                  exports+="$name=$value"$'\n'
                fi
              elif [[ "$line" == *"<<"* ]]; then
                name="${line%%"<<"*}"
                delimiter="${line#*"<<"}"
                if [ -z "$delimiter" ]; then
                  fail "Line $number of the $source starts a multi-line value with no delimiter after <<"
                  return
                fi
                keep=false
                if allowed "$source" "$number" "$name"; then
                  keep=true
                fi
                open=true
                start=$number
                value=""
                count=0
              else
                fail "Line $number of the $source is neither KEY=VALUE nor KEY<<DELIMITER"
                return
              fi
            done <<<"$text"
            if [ "$open" = true ]; then
              if [ "$secret" = true ]; then
                mask "$value"
              fi
              fail "The multi-line value that starts on line $start of the $source has no closing delimiter line"
            fi
          }
          parse "env input" false "$ENV_INPUT"
          parse "env secret" true "$ENV_SECRET"
          if [ "$failed" = true ]; then
            exit 1
          fi
          printf '%s' "$exports" >> "$GITHUB_ENV"
      - name: Select AWS role
        id: role
        env:
          MODE: pull-request
          ROLE_MAP: ${{ inputs.aws-role-arn-map }}
          DEFAULT_ROLE: ${{ inputs.aws-role-arn }}
          STACK_KEY: ${{ matrix.key }}
          STACK_PATH: ${{ matrix.stack }}
          INSTANCE: ${{ matrix.instance || matrix.workspace }}
        run: |
          role="$DEFAULT_ROLE"
          if [ "$MODE" = "plan" ] || [ "$MODE" = "drift" ]; then
            role="${PLAN_ROLE:-$DEFAULT_ROLE}"
            ROLE_MAP=""
          fi
          if [ -n "$ROLE_MAP" ]; then
            match=$(jq -r --arg key "$STACK_KEY" --arg instance "$INSTANCE" --arg path "$STACK_PATH" '
              (if $key != "" then .[$key] else null end)
              // (if $instance != "" then .[":" + $instance] else null end)
              // ([to_entries[] | select(.key as $prefix | ($prefix | contains(":") | not) and (($path + "/") | startswith(if ($prefix | endswith("/")) then $prefix else $prefix + "/" end)))] | max_by(.key | length) | .value)
              // empty' <<<"$ROLE_MAP")
            role="${match:-$role}"
          fi
          if [ -z "$role" ]; then
            echo "::notice::No AWS role for $STACK_KEY in aws-role-arn or aws-role-arn-map; skipping AWS credentials"
          fi
          echo "arn=$role" >> "$GITHUB_OUTPUT"
      - name: Select AWS role session name
        id: session
        env:
          MODE: plan
          SESSION_NAME: ${{ inputs.aws-role-session-name }}
        run: |
          name="$SESSION_NAME"
          if [[ "$name" =~ ^[[:space:]]*\{ ]]; then
            name=$(jq -r --arg mode "$MODE" '.[$mode] // (if $mode == "drift" then .plan else null end) // empty' <<<"$SESSION_NAME")
          fi
          name=$(printf '%s' "$name" | LC_ALL=C tr -c 'A-Za-z0-9_+=,.@-' '-')
          name="${name:0:64}"
          if [ "${#name}" -eq 1 ]; then
            echo "::error::aws-role-session-name must be 2 to 64 characters, got '$name'"
            exit 1
          fi
          echo "name=$name" >> "$GITHUB_OUTPUT"
      - if: steps.role.outputs.arn != ''
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ steps.role.outputs.arn }}
          role-session-name: ${{ steps.session.outputs.name }}
          aws-region: ${{ inputs.aws-region }}
      - name: Prepare plugin cache
        run: |
          mkdir -p "$RUNNER_TEMP/terraform-plugin-cache"
          echo "TF_PLUGIN_CACHE_DIR=$RUNNER_TEMP/terraform-plugin-cache" >> "$GITHUB_ENV"
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/terraform-plugin-cache
          key: stackorder-plugins-${{ runner.os }}-${{ runner.arch }}-${{ env.STACKORDER_TOOL }}-${{ hashFiles(format('{0}/{1}/.terraform.lock.hcl', inputs.working-directory, matrix.stack)) }}
          restore-keys: |
            stackorder-plugins-${{ runner.os }}-${{ runner.arch }}-${{ env.STACKORDER_TOOL }}-
      - uses: stackorder/actions/plan@v1
        with:
          stack: ${{ matrix.key }}
          run-id: ${{ needs.resolve.outputs.run-id }}
          server-url: ${{ inputs.server-url }}
          working-directory: ${{ inputs.working-directory }}

  fork-notice:
    if: github.event.pull_request.head.repo.fork == true
    runs-on: ${{ (startsWith(inputs.runner, '[') || startsWith(inputs.runner, '{')) && fromJSON(inputs.runner) || inputs.runner }}
    steps:
      - name: Explain why nothing was planned
        run: |
          echo "::notice::Stackorder does not plan pull requests from forks"
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          ## Stackorder plans skipped for this fork

          This pull request comes from a fork. GitHub gives fork pull requests a read-only
          `GITHUB_TOKEN` and no `id-token: write` permission, so the job can reach neither the
          AWS role nor the Stackorder server, and nothing was planned.

          A maintainer can push the branch to this repository to get plans.
          EOF
