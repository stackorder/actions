name: stackorder run

on:
  workflow_call:
    inputs:
      run-id:
        description: Stackorder run id from the dispatch.
        type: string
        required: true
      mode:
        description: plan, apply or drift.
        type: string
        required: true
      wave:
        description: Wave index of this dispatch, shown in job names.
        type: string
        default: ""
      sha:
        description: Commit to check out. Empty falls back to each stack entry's sha, then to the dispatched ref.
        type: string
        default: ""
      stacks:
        description: JSON array of stack entries (v1.MatrixEntry), each carrying its GitHub environment.
        type: string
        required: true
      server-url:
        description: Base URL of the Stackorder server.
        type: string
        required: true
      aws-role-arn-map:
        description: JSON object from a stack path prefix such as stacks/prod/, an exact stack key path:instance or :instance (that instance in any directory) to the IAM role ARN for applies. An exact key wins, then :instance, then the longest matching prefix.
        type: string
        default: ""
      aws-role-arn:
        description: IAM role to assume for every stack that matches no key in aws-role-arn-map. Empty with no match skips AWS credentials.
        type: string
        default: ""
      aws-plan-role-arn:
        description: IAM role for plan and drift dispatches, which run under the default environment and never use aws-role-arn-map. Empty falls back to aws-role-arn.
        type: string
        default: ""
      aws-role-session-name:
        description: AWS role session name, or a JSON object with plan, apply and drift keys (drift falls back to plan). Characters outside [\w+=,.@-] become - and the name is cut to 64 characters. Empty keeps the configure-aws-credentials default.
        type: string
        default: ""
      aws-region:
        description: AWS region for the credentials.
        type: string
        default: us-east-1
      tool:
        description: terraform or tofu, used when a stack entry does not name a tool.
        type: string
        default: terraform
      tool-version:
        description: Tool version to install when a stack entry does not pin one.
        type: string
        default: latest
      stackorder-version:
        description: stackorder CLI release to install, as 1.2.3, v1.2.3 or latest.
        type: string
        default: latest
      runner:
        description: Runner label, or a JSON array or object for runs-on.
        type: string
        default: ubuntu-latest
      max-parallel:
        description: Maximum number of stacks run at the same time.
        type: number
        default: 6
      working-directory:
        description: Directory to run stackorder in, relative to the repository root.
        type: string
        default: .
      env:
        description: Environment variables for the run jobs, as KEY=VALUE lines or KEY<<DELIMITER multi-line values, the syntax of $GITHUB_ENV.
        type: string
        default: ""
    secrets:
      env:
        description: Environment variables with secret values for the run jobs, in the syntax of the env input. Every value is masked.
        required: false

permissions: {}

defaults:
  run:
    shell: bash

jobs:
  run:
    name: ${{ inputs.wave != '' && format('{0} wave {1} {2}', inputs.mode, inputs.wave, matrix.key) || format('{0} {1}', inputs.mode, matrix.key) }}
    runs-on: ${{ (startsWith(inputs.runner, '[') || startsWith(inputs.runner, '{')) && fromJSON(inputs.runner) || inputs.runner }}
    environment: ${{ matrix.environment }}
    concurrency:
      group: stackorder-stack-${{ matrix.key }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      max-parallel: ${{ inputs.max-parallel }}
      matrix:
        include: ${{ fromJSON(inputs.stacks) }}
    permissions:
      id-token: write
      contents: read
      actions: read
      checks: write
    env:
      STACKORDER_RUN_ID: ${{ inputs.run-id }}
      STACKORDER_TOOL: ${{ matrix.tool || inputs.tool }}
    steps:
      - name: Check mode
        if: inputs.mode != 'plan' && inputs.mode != 'apply' && inputs.mode != 'drift'
        env:
          MODE: ${{ inputs.mode }}
        run: |
          echo "::error::Unknown mode '$MODE': expected plan, apply or drift"
          exit 1
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.sha || matrix.sha }}
      - if: env.STACKORDER_TOOL == 'terraform'
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ matrix.tool_version || inputs.tool-version }}
          terraform_wrapper: false
      - if: env.STACKORDER_TOOL != 'terraform'
        uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: ${{ matrix.tool_version || inputs.tool-version }}
          tofu_wrapper: false
      - uses: stackorder/actions/setup@v1
        with:
          version: ${{ inputs.stackorder-version }}
      - name: Export env
        env:
          ENV_INPUT: ${{ inputs.env }}
          ENV_SECRET: ${{ secrets.env }}
        run: |
          exports=""
          failed=false
          fail() {
            echo "::error::$1"
            failed=true
          }
          mask() {
            local line trimmed
            while IFS= read -r line; do
              trimmed="${line#"${line%%[![:space:]]*}"}"
              trimmed="${trimmed%"${trimmed##*[![:space:]]}"}"
              if [ -n "$line" ]; then
                printf '::add-mask::%s\n' "${line//%/%25}"
              fi
              if [ -n "$trimmed" ] && [ "$trimmed" != "$line" ]; then
                printf '::add-mask::%s\n' "${trimmed//%/%25}"
              fi
            done <<<"${1//$'\r'/$'\n'}"
          }
          allowed() {
            local source="$1" number="$2" name="$3" upper
            if ! [[ "$name" =~ ^[A-Za-z_][A-Za-z0-9_]*$ ]]; then
              fail "Line $number of the $source does not start with a variable name followed by = or <<"
              return 1
            fi
            upper=$(printf '%s' "$name" | tr '[:lower:]' '[:upper:]')
            if [[ "$upper" =~ ^(GITHUB_|RUNNER_|ACTIONS_|STACKORDER_|LD_) ]] || [[ "$upper" =~ ^(PATH|HOME|NODE_OPTIONS|BASH_ENV|BASHOPTS|SHELLOPTS|PS4)$ ]]; then
              fail "The $source sets $name, a reserved name: GITHUB_*, RUNNER_*, ACTIONS_*, STACKORDER_*, LD_*, PATH, HOME, NODE_OPTIONS, BASH_ENV, BASHOPTS, SHELLOPTS and PS4 cannot be set, in any letter case"
              return 1
            fi
          }
          parse() {
            local source="$1" secret="$2" text="$3"
            local line number=0 start=0 name="" value="" delimiter="" count=0 open=false keep=false
            while IFS= read -r line; do
              number=$((number + 1))
              line="${line%$'\r'}"
              if [ "$open" = true ]; then
                if [ "$line" != "$delimiter" ]; then
                  if [ "$count" -eq 0 ]; then
                    value="$line"
                  else
                    value+=$'\n'"$line"
                  fi
                  count=$((count + 1))
                  continue
                fi
                open=false
                if [ "$secret" = true ]; then
                  mask "$value"
                fi
                if [ "$keep" = true ]; then
                  exports+="$name<<$delimiter"$'\n'
                  if [ "$count" -gt 0 ]; then
                    exports+="$value"$'\n'
                  fi
                  exports+="$delimiter"$'\n'
                fi
                continue
              fi
              if [[ "$line" =~ ^[[:space:]]*$ ]]; then
                continue
              fi
              name="${line%%=*}"
              delimiter="${line%%"<<"*}"
              if [[ "$line" == *=* ]] && [ "${#name}" -lt "${#delimiter}" ]; then
                value="${line#*=}"
                if [ "$secret" = true ]; then
                  mask "$value"
                fi
                if allowed "$source" "$number" "$name"; then
                  exports+="$name=$value"$'\n'
                fi
              elif [[ "$line" == *"<<"* ]]; then
                name="${line%%"<<"*}"
                delimiter="${line#*"<<"}"
                if [ -z "$delimiter" ]; then
                  fail "Line $number of the $source starts a multi-line value with no delimiter after <<"
                  return
                fi
                keep=false
                if allowed "$source" "$number" "$name"; then
                  keep=true
                fi
                open=true
                start=$number
                value=""
                count=0
              else
                fail "Line $number of the $source is neither KEY=VALUE nor KEY<<DELIMITER"
                return
              fi
            done <<<"$text"
            if [ "$open" = true ]; then
              if [ "$secret" = true ]; then
                mask "$value"
              fi
              fail "The multi-line value that starts on line $start of the $source has no closing delimiter line"
            fi
          }
          parse "env input" false "$ENV_INPUT"
          parse "env secret" true "$ENV_SECRET"
          if [ "$failed" = true ]; then
            exit 1
          fi
          printf '%s' "$exports" >> "$GITHUB_ENV"
      - name: Select AWS role
        id: role
        env:
          MODE: ${{ inputs.mode }}
          ROLE_MAP: ${{ inputs.aws-role-arn-map }}
          DEFAULT_ROLE: ${{ inputs.aws-role-arn }}
          PLAN_ROLE: ${{ inputs.aws-plan-role-arn }}
          STACK_KEY: ${{ matrix.key }}
          STACK_PATH: ${{ matrix.stack }}
          INSTANCE: ${{ matrix.instance || matrix.workspace }}
        run: |
          role="$DEFAULT_ROLE"
          if [ "$MODE" = "plan" ] || [ "$MODE" = "drift" ]; then
            role="${PLAN_ROLE:-$DEFAULT_ROLE}"
            ROLE_MAP=""
          fi
          if [ -n "$ROLE_MAP" ]; then
            match=$(jq -r --arg key "$STACK_KEY" --arg instance "$INSTANCE" --arg path "$STACK_PATH" '
              (if $key != "" then .[$key] else null end)
              // (if $instance != "" then .[":" + $instance] else null end)
              // ([to_entries[] | select(.key as $prefix | ($prefix | contains(":") | not) and (($path + "/") | startswith(if ($prefix | endswith("/")) then $prefix else $prefix + "/" end)))] | max_by(.key | length) | .value)
              // empty' <<<"$ROLE_MAP")
            role="${match:-$role}"
          fi
          if [ -z "$role" ]; then
            echo "::notice::No AWS role for $STACK_KEY in aws-role-arn or aws-role-arn-map; skipping AWS credentials"
          fi
          echo "arn=$role" >> "$GITHUB_OUTPUT"
      - name: Select AWS role session name
        id: session
        env:
          MODE: ${{ inputs.mode }}
          SESSION_NAME: ${{ inputs.aws-role-session-name }}
        run: |
          name="$SESSION_NAME"
          if [[ "$name" =~ ^[[:space:]]*\{ ]]; then
            name=$(jq -r --arg mode "$MODE" '.[$mode] // (if $mode == "drift" then .plan else null end) // empty' <<<"$SESSION_NAME")
          fi
          name=$(printf '%s' "$name" | LC_ALL=C tr -c 'A-Za-z0-9_+=,.@-' '-')
          name="${name:0:64}"
          if [ "${#name}" -eq 1 ]; then
            echo "::error::aws-role-session-name must be 2 to 64 characters, got '$name'"
            exit 1
          fi
          echo "name=$name" >> "$GITHUB_OUTPUT"
      - if: steps.role.outputs.arn != ''
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ steps.role.outputs.arn }}
          role-session-name: ${{ steps.session.outputs.name }}
          aws-region: ${{ inputs.aws-region }}
      - name: Prepare plugin cache
        run: |
          mkdir -p "$RUNNER_TEMP/terraform-plugin-cache"
          echo "TF_PLUGIN_CACHE_DIR=$RUNNER_TEMP/terraform-plugin-cache" >> "$GITHUB_ENV"
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/terraform-plugin-cache
          key: stackorder-plugins-${{ runner.os }}-${{ runner.arch }}-${{ env.STACKORDER_TOOL }}-${{ hashFiles(format('{0}/{1}/.terraform.lock.hcl', inputs.working-directory, matrix.stack)) }}
          restore-keys: |
            stackorder-plugins-${{ runner.os }}-${{ runner.arch }}-${{ env.STACKORDER_TOOL }}-
      - if: inputs.mode == 'plan'
        uses: stackorder/actions/plan@v1
        with:
          stack: ${{ matrix.key }}
          run-id: ${{ inputs.run-id }}
          server-url: ${{ inputs.server-url }}
          working-directory: ${{ inputs.working-directory }}
      - if: inputs.mode == 'apply'
        uses: stackorder/actions/apply@v1
        with:
          stack: ${{ matrix.key }}
          run-id: ${{ inputs.run-id }}
          server-url: ${{ inputs.server-url }}
          plan-run-id: ${{ matrix.plan_run_id }}
          artifact: ${{ matrix.artifact }}
          working-directory: ${{ inputs.working-directory }}
      - if: inputs.mode == 'drift'
        uses: stackorder/actions/drift@v1
        with:
          stack: ${{ matrix.key }}
          run-id: ${{ inputs.run-id }}
          server-url: ${{ inputs.server-url }}
          working-directory: ${{ inputs.working-directory }}
