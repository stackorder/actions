name: Set up Stackorder
description: Install, verify, and cache the Stackorder CLI for Terraform and OpenTofu orchestration on GitHub Actions.
author: Stackorder
branding:
  icon: layers
  color: orange

inputs:
  version:
    description: stackorder release to install, as 1.2.3 or v1.2.3, or latest for the newest published release.
    required: false
    default: latest
  token:
    description: github.com token sent to the GitHub API when resolving latest. The default is github.token on github.com and empty elsewhere, so a GitHub Enterprise Server token never leaves its server; pass a github.com token there to avoid anonymous rate limits.
    required: false
    default: ${{ github.server_url == 'https://github.com' && github.token || '' }}
  checksum:
    description: Verify the archive against the release's stackorder_<version>_checksums.txt; true or false, and any other value fails the step.
    required: false
    default: "true"
  resolve-only:
    description: Resolve the version and set the version output without downloading, caching or adding the CLI to PATH; true or false, and any other value fails the step. The path output stays empty.
    required: false
    default: "false"

outputs:
  version:
    description: Resolved version, without the leading v; set whether or not the CLI is installed.
  path:
    description: Absolute path to the installed stackorder binary; empty when resolve-only is true.

runs:
  using: node24
  main: setup/dist/index.js
